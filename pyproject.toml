[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multilogue"
version = "0.1.0"
description = "Reusable Access→Assess→Address methodology for LLM-assisted public dialogue analysis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
]

[project.scripts]
multilogue-validate = "multilogue.experiment:main"

[project.optional-dependencies]
openai = ["openai>=1.40"]
litellm = ["litellm>=1.40"]
report = ["matplotlib>=3.7"]
distance = ["pot>=0.9"]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]
dev = [
    "pytest>=8",
    "openai>=1.40",
    "matplotlib>=3.7",
    "pot>=0.9",
    "nbformat>=5.9",
    "nbclient>=0.10",
    "ipython>=8",
    "ipykernel>=6",
    "pre-commit>=4",
    "nbstripout>=0.9",
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[tool.hatch.build.targets.wheel]
packages = ["multilogue"]

[tool.hatch.build.targets.wheel.force-include]
"multilogue/access/resources.json" = "multilogue/access/resources.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
